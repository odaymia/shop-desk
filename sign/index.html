<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Review &amp; Sign</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#13171e" />
<style>
  :root { color-scheme: light; --ink:#14181f; --muted:#5a6473; --line:#e3e7ed; --bg:#f4f6f9; --accent:#1657d6; --ok:#12945a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.5; }
  .wrap { max-width:640px; margin:0 auto; padding:18px 16px 60px; }
  .sheet { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .head { padding:18px 20px; border-bottom:1px solid var(--line); }
  .shop { font-size:20px; font-weight:700; }
  .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .ttl { font-weight:700; margin-top:10px; font-size:15px; }
  .who { display:flex; justify-content:space-between; gap:16px; padding:14px 20px; border-bottom:1px solid var(--line); font-size:14px; }
  .who .r { text-align:right; }
  .who strong { display:block; }
  .concern { padding:12px 20px; background:#f7f8fa; font-size:14px; border-bottom:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; }
  td { padding:9px 20px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  td.amt { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .sub { color:var(--muted); font-size:12px; }
  .totals { padding:12px 20px; }
  .totals .row { display:flex; justify-content:space-between; padding:3px 0; font-size:14px; }
  .totals .grand { font-weight:700; font-size:17px; border-top:1px solid var(--line); margin-top:6px; padding-top:8px; }
  .statement { padding:14px 20px; color:#333; font-size:13px; line-height:1.5; white-space:pre-wrap; border-top:1px solid var(--line); }
  .signwrap { padding:16px 20px 20px; }
  .signlabel { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .pad { position:relative; border:1px solid var(--line); border-radius:10px; background:#fff; touch-action:none; }
  canvas { width:100%; height:180px; display:block; border-radius:10px; }
  .padbase { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; border-top:1px dashed var(--line); }
  .padbase span { color:var(--muted); font-size:12px; }
  .namerow { margin-top:14px; }
  .namerow input { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--ink); }
  .btn { font-size:16px; font-weight:600; border-radius:10px; padding:14px 18px; border:1px solid transparent; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; width:100%; margin-top:16px; }
  .primary:disabled { opacity:.5; }
  .link { background:transparent; color:var(--muted); border:none; text-decoration:underline; cursor:pointer; font-size:13px; }
  .center { text-align:center; padding:48px 20px; }
  .center h1 { font-size:24px; margin:0 0 8px; }
  .center p { color:var(--muted); margin:0; }
  .okmark { width:56px; height:56px; border-radius:50%; background:rgba(18,148,90,.15); color:var(--ok); display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 14px; }
  .err { color:#b0341f; }
  .loading { text-align:center; padding:60px 20px; color:var(--muted); }
</style>
</head>
<body>
  <div class="wrap"><div id="app" class="loading">Loading…</div></div>
  <script type="module" src="/src/sign/main.js"></script>
</body>
</html>
